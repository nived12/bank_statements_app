# Subscription plan names used by Pay (name on Pay::Subscription).
# Stripe price IDs are set via ENV (STRIPE_PREMIUM_MONTHLY_PRICE_ID, STRIPE_PREMIUM_ANNUAL_PRICE_ID).
default: &default
  paid_plan_names:
    - premium
    - standard

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
