---
openapi: 3.0.1
info:
  title: VITTIO API V1
  version: v1
  description: API documentation for VITTIO - Personal Finance Management Platform
  contact:
    name: VITTIO Support
    url: https://vitt.io
paths:
  "/api/v1/signup":
    post:
      summary: Create a new user account
      tags:
      - Authentication
      description: Register a new user account and receive JWT tokens for authentication
      parameters: []
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticationResponse"
        '422':
          description: Email already taken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User's email address
                      example: john@example.com
                    password:
                      type: string
                      format: password
                      description: Password (minimum 6 characters)
                      example: password123
                    first_name:
                      type: string
                      description: User's first name
                      example: John
                    last_name:
                      type: string
                      description: User's last name
                      example: Doe
                  required:
                  - email
                  - password
                  - first_name
                  - last_name
              required:
              - user
              example:
                user:
                  email: john@example.com
                  password: password123
                  first_name: John
                  last_name: Doe
  "/api/v1/login":
    post:
      summary: Authenticate user and get tokens
      tags:
      - Authentication
      description: Login with email and password to receive JWT access and refresh
        tokens
      parameters: []
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticationResponse"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Email not confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User's email address
                      example: user@example.com
                    password:
                      type: string
                      format: password
                      description: User's password
                      example: password123
                  required:
                  - email
                  - password
              required:
              - user
              example:
                user:
                  email: user@example.com
                  password: password123
  "/api/v1/refresh":
    post:
      summary: Refresh access token
      tags:
      - Authentication
      description: Use a valid refresh token to obtain a new access token and refresh
        token pair
      parameters: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RefreshResponse"
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Valid JWT refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              required:
              - refresh_token
              example:
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  "/api/v1/logout":
    delete:
      summary: Logout and invalidate tokens
      tags:
      - Authentication
      description: Invalidate the current user's refresh token. Access token will
        remain valid until expiration (15 minutes).
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer {access_token}
        schema:
          type: string
      responses:
        '200':
          description: Logout successful
        '401':
          description: Missing authorization header
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/dashboard":
    get:
      summary: Get dashboard overview
      tags:
      - Dashboard
      security:
      - Bearer: []
      description: Get comprehensive dashboard data including account balances, transactions,
        and statistics
      parameters:
      - name: month
        in: query
        type: string
        required: false
        description: 'Filter data by month (format: YYYY-MM). Defaults to current
          month.'
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          example: 2024-12
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total_balance:
                            type: string
                            description: Total balance across all accounts
                          total_transactions:
                            type: integer
                            description: Total number of transactions
                          total_statements:
                            type: integer
                            description: Total number of statement files
                          selected_month:
                            type: string
                            description: Selected month in YYYY-MM format
                        required:
                        - total_balance
                        - total_transactions
                        - total_statements
                        - selected_month
                      monthly_summary:
                        type: object
                        properties:
                          total_income:
                            type: integer
                            description: Total income for the month
                          total_expenses:
                            type: integer
                            description: Total expenses for the month
                          net_income:
                            type: integer
                            description: Net income (income - expenses)
                          income_count:
                            type: integer
                            description: Number of income transactions
                          expense_count:
                            type: integer
                            description: Number of expense transactions
                        required:
                        - total_income
                        - total_expenses
                        - net_income
                        - income_count
                        - expense_count
                      monthly_stats:
                        type: object
                        properties:
                          average_transaction:
                            type: integer
                            description: Average transaction amount
                          largest_expense:
                            type: string
                            description: Largest expense transaction
                          largest_income:
                            type: string
                            description: Largest income transaction
                          daily_average:
                            type: integer
                            description: Average daily spending
                        required:
                        - average_transaction
                        - largest_expense
                        - largest_income
                        - daily_average
                      bank_accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              description: Display name of the account
                            custom_name:
                              type: string
                              nullable: true
                            bank_name:
                              type: string
                            account_type:
                              type: string
                              enum:
                              - checking
                              - savings
                              - credit_card
                              - investment
                              - other
                              - debit
                            opening_balance:
                              type: string
                            balance:
                              type: string
                              description: Current effective balance
                            currency:
                              type: string
                      bank_summaries:
                        type: array
                        items:
                          type: object
                          properties:
                            account_id:
                              type: integer
                            account_name:
                              type: string
                            bank_name:
                              type: string
                            balance:
                              type: string
                            transaction_count:
                              type: integer
                            recent_activity:
                              type: string
                              nullable: true
                            last_processed:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                      recent_transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            date:
                              type: string
                            description:
                              type: string
                            amount:
                              type: number
                              description: Transaction amount (negative for expenses)
                            transaction_type:
                              type: string
                              enum:
                              - income
                              - fixed_expense
                              - variable_expense
                              - transfer_in
                              - transfer_out
                            bank_account:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            category:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                icon:
                                  type: string
                                  nullable: true
                      recent_statement_files:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            filename:
                              type: string
                            status:
                              type: string
                            processed_at:
                              type: string
                              format: date-time
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                            bank_account:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                      category_summary:
                        type: object
                        properties:
                          categories:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                amount:
                                  type: string
                          has_data:
                            type: boolean
                      spending_trends:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                            total_expenses:
                              type: string
                              nullable: true
                            total_income:
                              type: string
                              nullable: true
                            net_income:
                              type: string
                              nullable: true
                      available_months:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              description: Month value in YYYY-MM format
                            label:
                              type: string
                              description: Formatted month label
                    required:
                    - summary
                    - monthly_summary
                    - monthly_stats
                    - bank_accounts
                    - bank_summaries
                    - recent_transactions
                    - recent_statement_files
                    - category_summary
                    - spending_trends
                    - available_months
                required:
                - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/email_confirmations":
    post:
      summary: Resend confirmation email
      tags:
      - Email Confirmation
      description: Request a new confirmation email. Returns success message regardless
        of whether email exists or is already confirmed (security measure to prevent
        email enumeration).
      parameters: []
      responses:
        '200':
          description: Confirmation email sent (if email exists and not confirmed)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send confirmation instructions
                  example: user@example.com
              required:
              - email
              example:
                email: user@example.com
  "/api/v1/email_confirmations/{token}":
    patch:
      summary: Confirm email with token
      tags:
      - Email Confirmation
      description: Confirm user email using the token from the confirmation email.
        Returns JWT tokens upon successful confirmation for immediate API access.
      parameters:
      - name: token
        in: path
        description: Email confirmation token from email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email already confirmed (no tokens returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Email is already confirmed
                      confirmed:
                        type: boolean
                        example: true
                      access_token:
                        type: string
                        description: JWT access token for API requests
                        example: eyJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        description: JWT refresh token for obtaining new access tokens
                        example: eyJhbGciOiJIUzI1NiJ9...
                      expires_in:
                        type: integer
                        description: Access token expiration time in seconds
                        example: 900
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        "$ref": "#/components/schemas/User"
                    required:
                    - message
                    - confirmed
        '422':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/password_resets":
    post:
      summary: Request password reset
      tags:
      - Password Reset
      description: Request a password reset email. Returns success message regardless
        of whether email exists (security measure to prevent email enumeration).
      parameters: []
      responses:
        '200':
          description: Password reset email sent (if email exists)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send password reset instructions
                  example: user@example.com
              required:
              - email
              example:
                email: user@example.com
  "/api/v1/password_resets/{token}":
    patch:
      summary: Reset password with token
      tags:
      - Password Reset
      description: Reset user password using the token from the password reset email
      parameters:
      - name: token
        in: path
        description: Password reset token from email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Password reset successful
        '422':
          description: Validation error (password mismatch)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    password:
                      type: string
                      format: password
                      description: New password (minimum 6 characters)
                      example: newpassword123
                    password_confirmation:
                      type: string
                      format: password
                      description: Password confirmation (must match password)
                      example: newpassword123
                  required:
                  - password
                  - password_confirmation
              required:
              - user
              example:
                user:
                  password: newpassword123
                  password_confirmation: newpassword123
  "/api/v1/transactions":
    get:
      summary: List transactions with pagination and filters
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Retrieve paginated list of transactions with optional filters and
        statistics
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number for pagination (default: 1)'
        schema:
          type: integer
      - name: page_token
        in: query
        required: false
        description: Alternative to 'page' parameter for pagination
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: 'Number of items per page (default: 20, max: 100)'
        schema:
          type: integer
      - name: bank_account_id
        in: query
        required: false
        description: Filter by bank account ID
        schema:
          type: integer
      - name: statement_file_id
        in: query
        required: false
        description: Filter by statement file ID
        schema:
          type: integer
      - name: transaction_type
        in: query
        type: string
        required: false
        description: Filter by transaction type
        schema:
          type: string
          enum:
          - income
          - fixed_expense
          - variable_expense
          - transfer
      - name: from_date
        in: query
        required: false
        description: Filter transactions from this date (YYYY-MM-DD)
        schema:
          type: string
      - name: to_date
        in: query
        required: false
        description: Filter transactions up to this date (YYYY-MM-DD)
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Search in transaction description
        schema:
          type: string
      - name: sort
        in: query
        type: string
        required: false
        description: 'Sort field (default: date)'
        schema:
          type: string
          enum:
          - date
          - amount
          - description
          - transaction_type
          - merchant
          - category
          - bank_account
      - name: direction
        in: query
        type: string
        required: false
        description: 'Sort direction (default: desc)'
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionsListResponse"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create a new transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Create a new manual transaction. Only manual transactions can be
        created via API.
      parameters: []
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction:
                  type: object
                  properties:
                    bank_account_id:
                      type: integer
                      description: ID of the bank account
                    date:
                      type: string
                      format: date
                      description: Transaction date (YYYY-MM-DD)
                    description:
                      type: string
                      description: Transaction description (min 4 characters)
                    amount:
                      type: number
                      description: Transaction amount (positive for income, will be
                        adjusted based on type)
                    transaction_type:
                      type: string
                      enum:
                      - income
                      - fixed_expense
                      - variable_expense
                      description: Type of transaction
                    category_id:
                      type: integer
                      description: ID of the category (optional)
                    merchant:
                      type: string
                      description: Merchant name (optional)
                    reference:
                      type: string
                      description: Reference number (optional)
                    transfer_account_id:
                      type: integer
                      description: 'For transfers: destination account ID (optional)'
                    saving_ids:
                      type: array
                      items:
                        type: integer
                      description: Link to saving goals (optional)
                    debt_ids:
                      type: array
                      items:
                        type: integer
                      description: Link to debt goals (optional)
                  required:
                  - bank_account_id
                  - date
                  - description
                  - amount
                  - transaction_type
  "/api/v1/transactions/{id}":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: integer
    get:
      summary: Get transaction details
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Retrieve detailed information about a specific transaction
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update a transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Update an existing manual transaction. Only manual transactions
        can be updated.
      parameters: []
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
        '403':
          description: Forbidden - Cannot update statement file transactions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Transaction description
                    amount:
                      type: number
                      description: Transaction amount
                    category_id:
                      type: integer
                      description: Category ID
                    merchant:
                      type: string
                      description: Merchant name
                    reference:
                      type: string
                      description: Reference number
    delete:
      summary: Delete a transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Delete an existing manual transaction. Only manual transactions
        can be deleted.
      responses:
        '200':
          description: Transaction deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden - Cannot delete statement file transactions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/transactions/summary":
    get:
      summary: Get transaction statistics
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Get transaction summary and statistics with optional filters
      parameters:
      - name: bank_account_id
        in: query
        required: false
        description: Filter by bank account ID
        schema:
          type: integer
      - name: transaction_type
        in: query
        required: false
        description: Filter by transaction type
        schema:
          type: string
      - name: from_date
        in: query
        required: false
        description: Filter from date (YYYY-MM-DD)
        schema:
          type: string
      - name: to_date
        in: query
        required: false
        description: Filter to date (YYYY-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: Summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          total_transactions:
                            type: integer
                          income_total:
                            type: number
                          expenses_total:
                            type: number
                          equity_total:
                            type: number
                          income_count:
                            type: integer
                          fixed_expense_count:
                            type: integer
                          variable_expense_count:
                            type: integer
                          category_count:
                            type: integer
                  meta:
                    type: object
                    properties:
                      filters:
                        type: object
                        properties:
                          bank_account_id:
                            type: integer
                            nullable: true
                          transaction_type:
                            type: string
                            nullable: true
                          from_date:
                            type: string
                            nullable: true
                          to_date:
                            type: string
                            nullable: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/user":
    get:
      summary: Get current user profile
      tags:
      - Users
      description: Returns the authenticated user's profile information
      security:
      - Bearer: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: User ID
                        example: 1
                      email:
                        type: string
                        format: email
                        description: User's email address
                        example: user@example.com
                      first_name:
                        type: string
                        description: User's first name
                        example: John
                      last_name:
                        type: string
                        description: User's last name
                        example: Doe
                      avatar_url:
                        type: string
                        format: uri
                        description: User's avatar URL
                        example: https://example.com/avatar.jpg
                      created_at:
                        type: string
                        format: date-time
                        description: Account creation date (ISO 8601)
                        example: '2024-01-15T10:30:00Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Account update date (ISO 8601)
                        example: '2024-01-15T10:30:00Z'
                    required:
                    - id
                    - email
                    - first_name
                    - last_name
                    - avatar_url
                    - created_at
                    - updated_at
                required:
                - data
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update current user profile
      tags:
      - Users
      description: Update the authenticated user's profile information (first_name,
        last_name, avatar_url)
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      avatar_url:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
        '422':
          description: Validation error - Invalid user data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                      description: User's first name
                      example: Jane
                    last_name:
                      type: string
                      description: User's last name
                      example: Smith
                    avatar_url:
                      type: string
                      format: uri
                      description: User's avatar URL
                      example: https://example.com/new-avatar.jpg
              required:
              - user
              example:
                user:
                  first_name: Jane
                  last_name: Smith
                  avatar_url: https://example.com/new-avatar.jpg
servers:
- url: https://vitt.io
  description: Production server
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v1/login or /api/v1/signup
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
            code:
              type: string
              description: Machine-readable error code
            field:
              type: string
              description: Field name for validation errors (optional)
          required:
          - message
      required:
      - error
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
            code:
              type: string
              description: Machine-readable error code
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
              description: Field-specific validation errors
          required:
          - message
          - code
      required:
      - error
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User email address
        first_name:
          type: string
          description: User's first name
        last_name:
          type: string
          description: User's last name
        full_name:
          type: string
          description: User's full name (first + last)
        confirmed:
          type: boolean
          description: Whether user's email is confirmed
        avatar_url:
          type: string
          format: uri
          description: User's avatar URL
      required:
      - id
      - email
      - first_name
      - last_name
      - full_name
      - avatar_url
    AuthenticationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token (expires in 15 minutes)
            refresh_token:
              type: string
              description: JWT refresh token (expires in 7 days)
            expires_in:
              type: integer
              description: Access token expiration time in seconds
            token_type:
              type: string
              description: Token type (Bearer)
            user:
              "$ref": "#/components/schemas/User"
          required:
          - access_token
          - refresh_token
          - user
      required:
      - data
    RefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: New JWT access token (expires in 15 minutes)
            refresh_token:
              type: string
              description: New JWT refresh token (expires in 7 days)
            expires_in:
              type: integer
              description: Access token expiration time in seconds
            token_type:
              type: string
              description: Token type (Bearer)
          required:
          - access_token
          - refresh_token
      required:
      - data
    Transaction:
      type: object
      properties:
        id:
          type: integer
          description: Transaction ID
        date:
          type: string
          format: date
          description: Transaction date (ISO 8601)
        description:
          type: string
          description: Transaction description
        amount:
          type: number
          description: Transaction amount (negative for expenses)
        transaction_type:
          type: string
          enum:
          - income
          - fixed_expense
          - variable_expense
          - transfer_in
          - transfer_out
          description: Type of transaction
        source:
          type: string
          enum:
          - manual
          - statement_file
          description: Source of transaction
        merchant:
          type: string
          nullable: true
          description: Merchant name
        reference:
          type: string
          nullable: true
          description: Reference number
        bank_account:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            account_type:
              type: string
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            icon:
              type: string
              nullable: true
        is_transfer:
          type: boolean
          description: Whether this is a transfer transaction
        transfer_account:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
      required:
      - id
      - date
      - description
      - amount
      - transaction_type
      - source
      - bank_account
      - is_transfer
      - created_at
      - updated_at
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
        next_page:
          type: integer
          nullable: true
          description: Next page number (null if on last page)
        prev_page:
          type: integer
          nullable: true
          description: Previous page number (null if on first page)
        total_pages:
          type: integer
          description: Total number of pages
        total_items:
          type: integer
          description: Total number of items across all pages
        page_size:
          type: integer
          description: Number of items per page
        from:
          type: integer
          description: Record number of first item on this page
        to:
          type: integer
          description: Record number of last item on this page
      required:
      - current_page
      - total_pages
      - total_items
      - page_size
      - from
      - to
    TransactionStats:
      type: object
      properties:
        total_transactions:
          type: integer
          description: Total number of transactions
        income_total:
          type: number
          description: Total income amount
        expenses_total:
          type: number
          description: Total expenses amount (negative)
        equity_total:
          type: number
          description: Net amount (income + expenses)
        income_count:
          type: integer
          description: Number of income transactions
        fixed_expense_count:
          type: integer
          description: Number of fixed expense transactions
        variable_expense_count:
          type: integer
          description: Number of variable expense transactions
        category_count:
          type: integer
          description: Number of unique categories used
      required:
      - total_transactions
      - income_total
      - expenses_total
      - equity_total
      - income_count
      - fixed_expense_count
      - variable_expense_count
      - category_count
    TransactionsListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            transactions:
              type: array
              items:
                "$ref": "#/components/schemas/Transaction"
          required:
          - transactions
        meta:
          type: object
          properties:
            pagination:
              "$ref": "#/components/schemas/Pagination"
            stats:
              "$ref": "#/components/schemas/TransactionStats"
            filters:
              type: object
              properties:
                bank_account_id:
                  type: integer
                  nullable: true
                statement_file_id:
                  type: integer
                  nullable: true
                transaction_type:
                  type: string
                  nullable: true
                from_date:
                  type: string
                  nullable: true
                to_date:
                  type: string
                  nullable: true
                search:
                  type: string
                  nullable: true
                sort:
                  type: string
                  nullable: true
                direction:
                  type: string
                  nullable: true
          required:
          - pagination
      required:
      - data
      - meta
    TransactionResponse:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/Transaction"
        message:
          type: string
          description: Optional success message
      required:
      - data
