---
openapi: 3.0.1
info:
  title: VITTIO API V1
  version: v1
  description: API documentation for VITTIO - Personal Finance Management Platform
  contact:
    name: VITTIO Support
    url: https://vitt.io
paths:
  "/api/v1/login":
    post:
      summary: Authenticate user and get tokens
      tags:
      - Authentication
      description: Login with email and password to receive JWT access and refresh
        tokens
      parameters: []
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_authentication_response"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '403':
          description: Email not confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User's email address
                      example: user@example.com
                    password:
                      type: string
                      format: password
                      description: User's password
                      example: password123
                  required:
                  - email
                  - password
              required:
              - user
              example:
                user:
                  email: user@example.com
                  password: password123
  "/api/v1/logout":
    delete:
      summary: Logout and invalidate tokens
      tags:
      - Authentication
      description: Invalidate the current user's refresh token. Access token will
        remain valid until expiration (15 minutes).
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer {access_token}
        schema:
          type: string
      responses:
        '200':
          description: Logout successful
        '401':
          description: Missing authorization header
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/refresh":
    post:
      summary: Refresh access token
      tags:
      - Authentication
      description: Use a valid refresh token to obtain a new access token and refresh
        token pair
      parameters: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_refresh_response"
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Valid JWT refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              required:
              - refresh_token
              example:
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  "/api/v1/signup":
    post:
      summary: Create a new user account
      tags:
      - Authentication
      description: Register a new user account and receive JWT tokens for authentication
      parameters: []
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_authentication_response"
        '422':
          description: Email already taken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User's email address
                      example: john@example.com
                    password:
                      type: string
                      format: password
                      description: Password (minimum 6 characters)
                      example: password123
                    first_name:
                      type: string
                      description: User's first name
                      example: John
                    last_name:
                      type: string
                      description: User's last name
                      example: Doe
                  required:
                  - email
                  - password
                  - first_name
                  - last_name
              required:
              - user
              example:
                user:
                  email: john@example.com
                  password: password123
                  first_name: John
                  last_name: Doe
  "/api/v1/bank_accounts":
    post:
      summary: Create a new bank account
      tags:
      - Bank Accounts
      security:
      - Bearer: []
      description: Create a new bank account for the authenticated user
      parameters: []
      responses:
        '201':
          description: Bank account created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_bank_account_single_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account:
                  type: object
                  properties:
                    bank_id:
                      type: integer
                      description: Bank ID
                    account_number:
                      type: string
                      description: Bank account number
                    custom_name:
                      type: string
                      description: Custom display name (optional)
                    currency:
                      type: string
                      description: Currency code (e.g., MXN, USD)
                    opening_balance:
                      type: number
                      format: float
                      description: Opening balance amount
                    opening_balance_date:
                      type: string
                      format: date
                      description: Opening balance date (YYYY-MM-DD)
                    account_type:
                      type: string
                      enum:
                      - debit
                      - credit
                      description: Account type (debit or credit)
                  required:
                  - bank_id
                  - account_number
                  - opening_balance_date
              example:
                bank_account:
                  bank_id: 1
                  account_number: '1234567890'
                  custom_name: My Savings Account
                  currency: MXN
                  opening_balance: 1000.5
                  opening_balance_date: '2024-01-01'
                  account_type: debit
    get:
      summary: List all bank accounts
      tags:
      - Bank Accounts
      security:
      - Bearer: []
      description: Retrieve list of all bank accounts for the authenticated user with
        bank details and transaction counts.
      responses:
        '200':
          description: Bank accounts retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_bank_accounts_list_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/bank_accounts/{id}":
    parameters:
    - name: id
      in: path
      description: Bank Account ID
      required: true
      schema:
        type: integer
    delete:
      summary: Delete a bank account
      tags:
      - Bank Accounts
      security:
      - Bearer: []
      description: Delete a bank account. Associated transactions will also be deleted
        (cascade).
      responses:
        '204':
          description: Bank account deleted successfully
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    get:
      summary: Get bank account details
      tags:
      - Bank Accounts
      security:
      - Bearer: []
      description: Retrieve a single bank account with its bank details and transaction
        count
      responses:
        '200':
          description: Bank account retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_bank_account_single_response"
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update a bank account
      tags:
      - Bank Accounts
      security:
      - Bearer: []
      description: Update an existing bank account
      parameters: []
      responses:
        '200':
          description: Bank account updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_bank_account_single_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account:
                  type: object
                  properties:
                    bank_id:
                      type: integer
                      description: Bank ID
                    account_number:
                      type: string
                      description: Bank account number
                    custom_name:
                      type: string
                      description: Custom display name
                    currency:
                      type: string
                      description: Currency code
                    opening_balance:
                      type: number
                      format: float
                      description: Opening balance amount
                    opening_balance_date:
                      type: string
                      format: date
                      description: Opening balance date
                    account_type:
                      type: string
                      enum:
                      - debit
                      - credit
                      description: Account type
              example:
                bank_account:
                  custom_name: Updated Account Name
                  opening_balance: 2000.0
  "/api/v1/categories":
    post:
      summary: Create a new category
      tags:
      - Categories
      security:
      - Bearer: []
      description: Create a new category or subcategory
      parameters: []
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_category_single_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Category name
                    icon:
                      type: string
                      description: Icon identifier (optional)
                    parent_id:
                      type: integer
                      description: Parent category ID for subcategories (optional)
                  required:
                  - name
              example:
                category:
                  name: Groceries
                  icon: shopping-cart
                  parent_id: 1
    get:
      summary: List all categories
      tags:
      - Categories
      security:
      - Bearer: []
      description: Retrieve hierarchical list of categories with their subcategories
        and transaction counts. Supports pagination.
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: 'Items per page (default: 20)'
        schema:
          type: integer
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_categories_list_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      description: Category ID
      required: true
      schema:
        type: integer
    delete:
      summary: Delete a category
      tags:
      - Categories
      security:
      - Bearer: []
      description: Delete a category. Categories with subcategories cannot be deleted.
        Associated transactions will have their category_id nullified.
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '422':
          description: Cannot delete category with subcategories
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    get:
      summary: Get category details
      tags:
      - Categories
      security:
      - Bearer: []
      description: Retrieve a single category with its subcategories and transaction
        count
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_category_single_response"
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update a category
      tags:
      - Categories
      security:
      - Bearer: []
      description: Update an existing category
      parameters: []
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_category_single_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Category name
                    icon:
                      type: string
                      description: Icon identifier
                    parent_id:
                      type: integer
                      description: Parent category ID
              example:
                category:
                  name: Updated Name
                  icon: new-icon
  "/api/v1/dashboard":
    get:
      summary: Get dashboard overview
      tags:
      - Dashboard
      security:
      - Bearer: []
      description: Get comprehensive dashboard data including account balances, transactions,
        and statistics
      parameters:
      - name: month
        in: query
        type: string
        required: false
        description: 'Filter data by month (format: YYYY-MM). Defaults to current
          month.'
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          example: 2024-12
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total_balance:
                            type: string
                            description: Total balance across all accounts
                          total_transactions:
                            type: integer
                            description: Total number of transactions
                          total_statements:
                            type: integer
                            description: Total number of statement files
                          selected_month:
                            type: string
                            description: Selected month in YYYY-MM format
                        required:
                        - total_balance
                        - total_transactions
                        - total_statements
                        - selected_month
                      monthly_summary:
                        type: object
                        properties:
                          total_income:
                            type: integer
                            description: Total income for the month
                          total_expenses:
                            type: integer
                            description: Total expenses for the month
                          net_income:
                            type: integer
                            description: Net income (income - expenses)
                          income_count:
                            type: integer
                            description: Number of income transactions
                          expense_count:
                            type: integer
                            description: Number of expense transactions
                        required:
                        - total_income
                        - total_expenses
                        - net_income
                        - income_count
                        - expense_count
                      monthly_stats:
                        type: object
                        properties:
                          average_transaction:
                            type: integer
                            description: Average transaction amount
                          largest_expense:
                            type: string
                            description: Largest expense transaction
                          largest_income:
                            type: string
                            description: Largest income transaction
                          daily_average:
                            type: integer
                            description: Average daily spending
                        required:
                        - average_transaction
                        - largest_expense
                        - largest_income
                        - daily_average
                      bank_accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              description: Display name of the account
                            custom_name:
                              type: string
                              nullable: true
                            bank_name:
                              type: string
                            account_type:
                              type: string
                              enum:
                              - checking
                              - savings
                              - credit_card
                              - investment
                              - other
                              - debit
                            opening_balance:
                              type: string
                            balance:
                              type: string
                              description: Current effective balance
                            currency:
                              type: string
                      bank_summaries:
                        type: array
                        items:
                          type: object
                          properties:
                            account_id:
                              type: integer
                            account_name:
                              type: string
                            bank_name:
                              type: string
                            balance:
                              type: string
                            transaction_count:
                              type: integer
                            recent_activity:
                              type: string
                              nullable: true
                            last_processed:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
                      recent_transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            date:
                              type: string
                            description:
                              type: string
                            amount:
                              type: number
                              description: Transaction amount (negative for expenses)
                            transaction_type:
                              type: string
                              enum:
                              - income
                              - fixed_expense
                              - variable_expense
                              - transfer_in
                              - transfer_out
                            bank_account:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            category:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                icon:
                                  type: string
                                  nullable: true
                      recent_statement_files:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            filename:
                              type: string
                            status:
                              type: string
                            processed_at:
                              type: string
                              format: date-time
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                            bank_account:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                      category_summary:
                        type: object
                        properties:
                          categories:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                amount:
                                  type: string
                          has_data:
                            type: boolean
                      spending_trends:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                            total_expenses:
                              type: string
                              nullable: true
                            total_income:
                              type: string
                              nullable: true
                            net_income:
                              type: string
                              nullable: true
                      available_months:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              description: Month value in YYYY-MM format
                            label:
                              type: string
                              description: Formatted month label
                    required:
                    - summary
                    - monthly_summary
                    - monthly_stats
                    - bank_accounts
                    - bank_summaries
                    - recent_transactions
                    - recent_statement_files
                    - category_summary
                    - spending_trends
                    - available_months
                required:
                - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/email_confirmations":
    post:
      summary: Resend confirmation email
      tags:
      - Email Confirmation
      description: Request a new confirmation email. Returns success message regardless
        of whether email exists or is already confirmed (security measure to prevent
        email enumeration).
      parameters: []
      responses:
        '200':
          description: Confirmation email sent (if email exists and not confirmed)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send confirmation instructions
                  example: user@example.com
              required:
              - email
              example:
                email: user@example.com
  "/api/v1/email_confirmations/{token}":
    patch:
      summary: Confirm email with token
      tags:
      - Email Confirmation
      description: Confirm user email using the token from the confirmation email.
        Returns JWT tokens upon successful confirmation for immediate API access.
      parameters:
      - name: token
        in: path
        description: Email confirmation token from email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email already confirmed (no tokens returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Email is already confirmed
                      confirmed:
                        type: boolean
                        example: true
                      access_token:
                        type: string
                        description: JWT access token for API requests
                        example: eyJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        description: JWT refresh token for obtaining new access tokens
                        example: eyJhbGciOiJIUzI1NiJ9...
                      expires_in:
                        type: integer
                        description: Access token expiration time in seconds
                        example: 900
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        "$ref": "#/components/schemas/v1_user_response"
                    required:
                    - message
                    - confirmed
        '422':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/password_resets":
    post:
      summary: Request password reset
      tags:
      - Password Reset
      description: Request a password reset email. Returns success message regardless
        of whether email exists (security measure to prevent email enumeration).
      parameters: []
      responses:
        '200':
          description: Password reset email sent (if email exists)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send password reset instructions
                  example: user@example.com
              required:
              - email
              example:
                email: user@example.com
  "/api/v1/password_resets/{token}":
    patch:
      summary: Reset password with token
      tags:
      - Password Reset
      description: Reset user password using the token from the password reset email
      parameters:
      - name: token
        in: path
        description: Password reset token from email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Password reset successful
        '422':
          description: Validation error (password mismatch)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    password:
                      type: string
                      format: password
                      description: New password (minimum 6 characters)
                      example: newpassword123
                    password_confirmation:
                      type: string
                      format: password
                      description: Password confirmation (must match password)
                      example: newpassword123
                  required:
                  - password
                  - password_confirmation
              required:
              - user
              example:
                user:
                  password: newpassword123
                  password_confirmation: newpassword123
  "/api/v1/statement_files":
    post:
      summary: Upload a statement file
      tags:
      - Statement Files
      security:
      - Bearer: []
      description: 'Upload a PDF statement file for processing. The file will be queued
        for async processing. Only PDF files up to 10MB are accepted. Send multipart
        form data with statement_file[bank_account_id] (required), statement_file[file]
        (required, PDF file), statement_file[cutoff_date] (optional, accepts both
        date strings like ''2024-01-15'' or ISO8601 UTC datetimes like ''2024-01-15T14:30:45Z''),
        statement_file[processing_strategy] (optional, default: ''parser_only'', values:
        ''parser_only'', ''text_with_ai'', ''vision_ai''), and statement_file[file_password]
        (optional, password for password-protected PDF files). Rate limits: 20 uploads/hour
        per IP, 50 uploads/hour per user.'
      responses:
        '201':
          description: Statement file uploaded successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_statement_file_single_response"
        '400':
          description: Bad request - Missing required parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '429':
          description: Too many requests - Rate limit exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    get:
      summary: List all statement files
      tags:
      - Statement Files
      security:
      - Bearer: []
      description: Retrieve paginated list of statement files for the authenticated
        user with bank account details and processing status.
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: 'Items per page (default: 20, max: 100)'
        schema:
          type: integer
      responses:
        '200':
          description: Statement files retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_statement_files_list_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/statement_files/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Statement file ID
      schema:
        type: integer
    delete:
      summary: Delete a statement file
      tags:
      - Statement Files
      security:
      - Bearer: []
      description: Delete a statement file and all associated statement-sourced transactions.
        Manual transactions are preserved but unlinked.
      responses:
        '204':
          description: Statement file deleted successfully
        '404':
          description: Statement file not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    get:
      summary: Get statement file details
      tags:
      - Statement Files
      security:
      - Bearer: []
      description: Retrieve details of a specific statement file including processing
        status, bank account, and transaction count.
      responses:
        '200':
          description: Statement file retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_statement_file_single_response"
        '404':
          description: Statement file not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/statement_files/{id}/retry":
    parameters:
    - name: id
      in: path
      required: true
      description: Statement file ID
      schema:
        type: integer
    post:
      summary: Retry failed statement file processing
      tags:
      - Statement Files
      security:
      - Bearer: []
      description: Retry processing for a failed statement file. Only statement files
        with 'error' status can be retried. Resets status to 'pending' and enqueues
        for processing.
      responses:
        '200':
          description: Statement file processing restarted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_statement_file_single_response"
        '422':
          description: Retry not allowed - Statement file status is not 'error'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: Statement file not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/transactions":
    post:
      summary: Create a new transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Create a new manual transaction. Only manual transactions can be
        created via API.
      parameters: []
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_transaction_single_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction:
                  type: object
                  properties:
                    bank_account_id:
                      type: integer
                      description: ID of the bank account
                    date:
                      type: string
                      format: date
                      description: Transaction date (YYYY-MM-DD)
                    description:
                      type: string
                      description: Transaction description (min 4 characters)
                    amount:
                      type: number
                      description: Transaction amount (positive for income, will be
                        adjusted based on type)
                    transaction_type:
                      type: string
                      enum:
                      - income
                      - fixed_expense
                      - variable_expense
                      description: Type of transaction
                    category_id:
                      type: integer
                      description: ID of the category (optional)
                    merchant:
                      type: string
                      description: Merchant name (optional)
                    reference:
                      type: string
                      description: Reference number (optional)
                    transfer_account_id:
                      type: integer
                      description: 'For transfers: destination account ID (optional)'
                    saving_ids:
                      type: array
                      items:
                        type: integer
                      description: Link to saving goals (optional)
                    debt_ids:
                      type: array
                      items:
                        type: integer
                      description: Link to debt goals (optional)
                  required:
                  - bank_account_id
                  - date
                  - description
                  - amount
                  - transaction_type
    get:
      summary: List transactions with pagination and filters
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Retrieve paginated list of transactions with optional filters
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number for pagination (default: 1)'
        schema:
          type: integer
      - name: page_token
        in: query
        required: false
        description: Alternative to 'page' parameter for pagination
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: 'Number of items per page (default: 20, max: 100)'
        schema:
          type: integer
      - name: bank_account_id
        in: query
        required: false
        description: Filter by bank account ID
        schema:
          type: integer
      - name: statement_file_id
        in: query
        required: false
        description: Filter by statement file ID
        schema:
          type: integer
      - name: transaction_type
        in: query
        type: string
        required: false
        description: Filter by transaction type
        schema:
          type: string
          enum:
          - income
          - fixed_expense
          - variable_expense
          - transfer
      - name: from_date
        in: query
        required: false
        description: Filter transactions from this date (YYYY-MM-DD)
        schema:
          type: string
      - name: to_date
        in: query
        required: false
        description: Filter transactions up to this date (YYYY-MM-DD)
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Search in transaction description
        schema:
          type: string
      - name: sort
        in: query
        type: string
        required: false
        description: 'Sort field (default: date)'
        schema:
          type: string
          enum:
          - date
          - amount
          - description
          - transaction_type
          - merchant
          - category
          - bank_account
      - name: direction
        in: query
        type: string
        required: false
        description: 'Sort direction (default: desc)'
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_transactions_list_response"
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/transactions/{id}":
    parameters:
    - name: id
      in: path
      description: Transaction ID
      required: true
      schema:
        type: integer
    delete:
      summary: Delete a transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Delete an existing manual transaction. Only manual transactions
        can be deleted.
      responses:
        '200':
          description: Transaction deleted successfully
          content:
            application/json:
