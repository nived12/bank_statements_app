# PR comments dispatch `issue_comment`. GitHub only runs workflows triggered this way using
# the workflow file present on the default branch — merge this YAML to default before comments work.
name: Rails E2E

on:
  issue_comment:
    types: [created]

jobs:
  e2e:
    # GitHub Expressions have no lowercase(); keep trigger phrase exact (also matches as substring).
    if: github.event.issue.pull_request && contains(github.event.comment.body || '', 'run-e2e')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bank_statements_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bank_statements_test
      # Test env skips encrypted credentials (see config/application.rb) — avoids RAILS_MASTER_KEY in CI.
      RAILS_ENV: test
      # Rails 8 reads credentials for secret_key_base unless this is set; set before decrypt runs (see Configuration#secret_key_base).
      SECRET_KEY_BASE: test_e2e_secret_key_do_not_use_in_production_must_be_long_enough_minimum
      PLAYWRIGHT_E2E: "1"
      PLAYWRIGHT_RAILS_ENV: test

    steps:
      - name: Create PR check run
        id: create_check
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber
            });
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Rails E2E (run-e2e)",
              head_sha: pr.head.sha,
              status: "in_progress",
              details_url: runUrl,
              output: {
                title: "Rails E2E started",
                summary: "Triggered by PR comment `run-e2e`."
              }
            });
            core.setOutput("check_run_id", String(check.id));
            core.setOutput("head_sha", pr.head.sha);

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@v6

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev node-gyp pkg-config python-is-python3 google-chrome-stable ghostscript

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build
          npm run build:css

      - name: Prepare database with seeds
        run: bin/rails db:create db:schema:load db:seed

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        id: playwright
        continue-on-error: true
        run: npm run e2e

      - name: Upload Playwright report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rails-e2e-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright screenshots and videos
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rails-e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Comment E2E results on PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          REPORT_ARTIFACT_ID: ${{ steps.upload_report.outputs['artifact-id'] }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs['artifact-url'] }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.upload_evidence.outputs['artifact-id'] }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.upload_evidence.outputs['artifact-url'] }}
          RESULTS_JSON: e2e/playwright-report/results.json
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- rails-e2e-comment -->";
            const issueNumber = context.payload.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const status = process.env.PLAYWRIGHT_OUTCOME === "success" ? "passed" : "failed";
            const icon = process.env.PLAYWRIGHT_OUTCOME === "success" ? "✅" : "❌";
            const reportLink =
              process.env.REPORT_ARTIFACT_URL ||
              (process.env.REPORT_ARTIFACT_ID
                ? `${runUrl}/artifacts/${process.env.REPORT_ARTIFACT_ID}`
                : runUrl);
            const evidenceLink =
              process.env.EVIDENCE_ARTIFACT_URL ||
              (process.env.EVIDENCE_ARTIFACT_ID
                ? `${runUrl}/artifacts/${process.env.EVIDENCE_ARTIFACT_ID}`
                : runUrl);
            const failedTests = [];

            if (fs.existsSync(process.env.RESULTS_JSON || "")) {
              const report = JSON.parse(fs.readFileSync(process.env.RESULTS_JSON, "utf8"));
              const collectFailedTests = (suite, titlePath = []) => {
                const suiteTitlePath = suite.title ? [...titlePath, suite.title] : titlePath;
                for (const spec of suite.specs || []) {
                  const hasFailure = (spec.tests || []).some((test) =>
                    (test.results || []).some((result) =>
                      ["failed", "timedOut", "interrupted"].includes(result.status)
                    )
                  );
                  if (hasFailure) {
                    failedTests.push([...suiteTitlePath, spec.title].filter(Boolean).join(" › "));
                  }
                }
                for (const childSuite of suite.suites || []) {
                  collectFailedTests(childSuite, suiteTitlePath);
                }
              };
              collectFailedTests(report);
            }
            const failedSummary =
              failedTests.length > 0
                ? `\n### Failed tests\n${failedTests.slice(0, 10).map((name) => `- \`${name}\``).join("\n")}${
                    failedTests.length > 10 ? `\n- ...and ${failedTests.length - 10} more` : ""
                  }\n`
                : "";
            const body = `${marker}
            ## ${icon} Rails Playwright E2E ${status}

            - Workflow run: [Open run logs](${runUrl})
            - HTML report artifact: [Download report](${reportLink})
            - Screenshots/videos artifact: [Download test results](${evidenceLink})
            ${failedSummary}

            Triggered by comment: \`run-e2e\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

      - name: Update PR check run
        if: always()
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
        with:
          script: |
            if (!process.env.CHECK_RUN_ID) {
              core.warning("No check run id found; skipping check update.");
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const succeeded = process.env.PLAYWRIGHT_OUTCOME === "success";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: "completed",
              conclusion: succeeded ? "success" : "failure",
              completed_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: succeeded ? "Rails E2E passed" : "Rails E2E failed",
                summary: succeeded
                  ? "Playwright E2E completed successfully."
                  : "Playwright E2E failed. Check workflow logs and artifacts."
              }
            });

      - name: Fail workflow when Playwright fails
        if: steps.playwright.outcome != 'success'
        run: exit 1
