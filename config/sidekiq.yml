---
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>
:queues:
  - default
  - mailers
  - active_storage
  - action_mailbox
  - low_priority # CleanupExpiredTokensJob — was missing, so the job could never be processed

:max_retries: 3
:retry_interval: 5

# Must stay under deploy.drainingSeconds in railway.json, which is how long
# Railway waits between SIGTERM and SIGKILL. Sidekiq re-queues in-flight jobs at
# the END of this window, so a SIGKILL landing first loses them instead.
# spec/lib/shutdown_budget_spec.rb asserts the two stay in that order.
:timeout: 10

# Railway-specific settings
:environment: <%= ENV.fetch("RAILS_ENV", "development") %>
:logfile: "log/sidekiq.log"
:pidfile: "tmp/pids/sidekiq.pid"

# Redis connection settings
:redis:
  :url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  :network_timeout: 5
  :pool_timeout: 5
