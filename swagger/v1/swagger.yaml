          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    get:
      summary: Get transaction details
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Retrieve detailed information about a specific transaction
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_transaction_single_response"
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update a transaction
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Update an existing manual transaction. Only manual transactions
        can be updated.
      parameters: []
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/v1_transaction_single_response"
        '403':
          description: Forbidden - Cannot update statement file transactions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Transaction description
                    amount:
                      type: number
                      description: Transaction amount
                    category_id:
                      type: integer
                      description: Category ID
                    merchant:
                      type: string
                      description: Merchant name
                    reference:
                      type: string
                      description: Reference number
  "/api/v1/transactions/summary":
    get:
      summary: Get transaction statistics
      tags:
      - Transactions
      security:
      - Bearer: []
      description: Get transaction summary and statistics with optional filters
      parameters:
      - name: bank_account_id
        in: query
        required: false
        description: Filter by bank account ID
        schema:
          type: integer
      - name: transaction_type
        in: query
        required: false
        description: Filter by transaction type
        schema:
          type: string
      - name: from_date
        in: query
        required: false
        description: Filter from date (YYYY-MM-DD)
        schema:
          type: string
      - name: to_date
        in: query
        required: false
        description: Filter to date (YYYY-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: Summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          total_transactions:
                            type: integer
                          income_total:
                            type: number
                          expenses_total:
                            type: number
                          equity_total:
                            type: number
                          income_count:
                            type: integer
                          fixed_expense_count:
                            type: integer
                          variable_expense_count:
                            type: integer
                          category_count:
                            type: integer
                  meta:
                    type: object
                    properties:
                      filters:
                        type: object
                        properties:
                          bank_account_id:
                            type: integer
                            nullable: true
                          transaction_type:
                            type: string
                            nullable: true
                          from_date:
                            type: string
                            nullable: true
                          to_date:
                            type: string
                            nullable: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
  "/api/v1/user":
    get:
      summary: Get current user profile
      tags:
      - Users
      description: Returns the authenticated user's profile information
      security:
      - Bearer: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: User ID
                        example: 1
                      email:
                        type: string
                        format: email
                        description: User's email address
                        example: user@example.com
                      first_name:
                        type: string
                        description: User's first name
                        example: John
                      last_name:
                        type: string
                        description: User's last name
                        example: Doe
                      avatar_url:
                        type: string
                        format: uri
                        description: User's avatar URL
                        example: https://example.com/avatar.jpg
                      created_at:
                        type: string
                        format: date-time
                        description: Account creation date (ISO 8601)
                        example: '2024-01-15T10:30:00Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Account update date (ISO 8601)
                        example: '2024-01-15T10:30:00Z'
                    required:
                    - id
                    - email
                    - first_name
                    - last_name
                    - avatar_url
                    - created_at
                    - updated_at
                required:
                - data
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    patch:
      summary: Update current user profile
      tags:
      - Users
      description: Update the authenticated user's profile information (first_name,
        last_name, avatar_url)
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      avatar_url:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
        '422':
          description: Validation error - Invalid user data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                      description: User's first name
                      example: Jane
                    last_name:
                      type: string
                      description: User's last name
                      example: Smith
                    avatar_url:
                      type: string
                      format: uri
                      description: User's avatar URL
                      example: https://example.com/new-avatar.jpg
              required:
              - user
              example:
                user:
                  first_name: Jane
                  last_name: Smith
                  avatar_url: https://example.com/new-avatar.jpg
servers:
- url: https://vitt.io
  description: Production server
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v1/login or /api/v1/signup
  schemas:
    error_response:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
            code:
              type: string
              description: Machine-readable error code
            field:
              type: string
              description: Field name for validation errors (optional)
          required:
          - message
      required:
      - error
    pagination_response:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
        next_page:
          type:
          - integer
          - 'null'
          description: Next page number (null if on last page)
        prev_page:
          type:
          - integer
          - 'null'
          description: Previous page number (null if on first page)
        total_pages:
          type: integer
          description: Total number of pages available
        total_items:
          type: integer
          description: Total number of items across all pages
        page_size:
          type: integer
          description: Number of items per page
        from:
          type:
          - integer
          - 'null'
          description: Record number of first item on this page
        to:
          type:
          - integer
          - 'null'
          description: Record number of last item on this page
      required:
      - current_page
      - total_pages
      - total_items
      - page_size
    v1_authentication_response:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: JWT refresh token
            expires_in:
              type: integer
              description: Token expiration time in seconds
            token_type:
              type: string
              description: Token type (Bearer)
            user:
              "$ref": "#/components/schemas/v1_user_response"
          required:
          - access_token
          - refresh_token
          - expires_in
          - token_type
          - user
      required:
      - data
    v1_bank_account_response:
      type: object
      properties:
        id:
          type: integer
          description: Bank Account ID
        account_number:
          type: string
          description: Bank account number
        currency:
          type: string
          nullable: true
          description: Currency code (e.g., MXN, USD)
        opening_balance:
          type: string
          nullable: true
          description: Opening balance amount (decimal as string)
        opening_balance_date:
          type: string
          format: date
          description: Opening balance date (YYYY-MM-DD)
        custom_name:
          type: string
          nullable: true
          description: Custom display name for the account
        account_type:
          type: string
          enum:
          - debit
          - credit
          description: Account type (debit or credit)
        display_name:
          type: string
          description: Formatted display name (includes bank and account number)
        bank:
          type: object
          description: Associated bank information
          properties:
            id:
              type: integer
              description: Bank ID
            code:
              type: string
              description: Bank code identifier
            name:
              type: string
              description: Bank name
            supported_for_parsing:
              type: boolean
              description: Whether the bank supports statement parsing
          required:
          - id
          - code
          - name
          - supported_for_parsing
        transactions_count:
          type: integer
          description: Number of transactions in this account
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
      required:
      - id
      - account_number
      - opening_balance_date
      - account_type
      - display_name
      - bank
      - transactions_count
      - created_at
      - updated_at
    v1_bank_account_single_response:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/v1_bank_account_response"
        message:
          type: string
          description: Optional success message
      required:
      - data
    v1_bank_accounts_list_response:
      type: object
      properties:
        data:
          type: object
          properties:
            bank_accounts:
              type: array
              items:
                "$ref": "#/components/schemas/v1_bank_account_response"
          required:
          - bank_accounts
      required:
      - data
    v1_categories_list_response:
      type: object
      properties:
        data:
          type: object
          properties:
            categories:
              type: array
              items:
                "$ref": "#/components/schemas/v1_category_response"
          required:
          - categories
        meta:
          type: object
          properties:
            pagination:
              "$ref": "#/components/schemas/pagination_response"
          required:
          - pagination
      required:
      - data
      - meta
    v1_category_response:
      type: object
      properties:
        id:
          type: integer
          description: Category ID
        name:
          type: string
          description: Category name
        icon:
          type: string
          nullable: true
          description: Category icon identifier
        parent_id:
          type: integer
          nullable: true
          description: Parent category ID (null for top-level categories)
        transactions_count:
          type: integer
          description: Number of transactions in this category
        children:
          type: array
          description: Subcategories
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              icon:
                type: string
                nullable: true
              parent_id:
                type: integer
              transactions_count:
                type: integer
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
      required:
      - id
      - name
      - transactions_count
      - children
      - created_at
      - updated_at
    v1_category_single_response:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/v1_category_response"
        message:
          type: string
          description: Optional success message
      required:
      - data
    v1_refresh_response:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: JWT refresh token
            expires_in:
              type: integer
              description: Token expiration time in seconds
            token_type:
              type: string
              description: Token type (Bearer)
          required:
          - access_token
          - refresh_token
          - expires_in
          - token_type
      required:
      - data
    v1_statement_file_response:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the statement file
        status:
          type: string
          enum:
          - pending
          - processing
          - parsed
          - completed
          - error
          description: Processing status of the statement file
        processing_strategy:
          type: string
          enum:
          - parser_only
          - text_with_ai
          - vision_ai
          description: Processing strategy for this statement
        filename:
          type: string
          description: Original filename of the uploaded PDF
        file_size:
          type: integer
          description: Size of the uploaded file in bytes
          nullable: true
        cutoff_date:
          type: string
          format: date-time
          description: Cutoff date for statement processing (ISO8601 format)
          nullable: true
        error_message:
          type: string
          description: Error message if processing failed
          nullable: true
        processed_at:
          type: string
          format: date-time
          description: Timestamp when processing completed (ISO8601 format)
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Timestamp when the statement file was created (ISO8601 format)
        updated_at:
          type: string
          format: date-time
