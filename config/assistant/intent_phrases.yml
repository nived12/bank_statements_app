# Conversational intent phrase catalog for Vittbot.
#
# Phrases are stored ASCII-transliterated (no accents) and lowercase.
# The matcher normalizes user input the same way (I18n.transliterate + downcase)
# and uses word-boundary anchored substring matching, so phrases like "hola"
# will not match inside "ahorros".
#
# Add new phrases here — no Ruby change required.
# Response copy for each intent lives in config/locales/assistant.{en,es}.yml
# under `assistant.responses.<intent>.{headline,actions,next}`.
greeting:
  - hola
  - hey
  - hi
  - hello
  - buenas
  - buenos dias
  - buenas tardes
  - buenas noches
  - que onda
  - que tal
  - saludos
  - good morning
  - good afternoon
  - good evening
  - howdy
thanks:
  - gracias
  - mil gracias
  - muchas gracias
  - thanks
  - thank you
  - ty
  - thx
identity:
