name: Rails E2E

on:
  issue_comment:
    types: [created]

jobs:
  e2e:
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'run-e2e')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bank_statements_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bank_statements_test
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@v6

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev node-gyp pkg-config python-is-python3 google-chrome-stable ghostscript

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build
          npm run build:css

      - name: Prepare database with seeds
        run: bin/rails db:create db:schema:load db:seed

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rails-e2e-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
