name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on PR comments that contain the trigger phrase
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request and provide a BRIEF, CONCISE review.

            IMPORTANT FORMATTING RULES:
            - Keep your ENTIRE review under 500 words
            - Use bullet points, not paragraphs
            - ALWAYS include file path and line number for each issue (e.g., "app/models/user.rb:42")
            - Only mention issues if you find them - don't add "looks good" items
            - Group related items together
            - Be direct and to the point

            Review for:
            - Code quality and best practices
            - Potential bugs or issues
            - Security concerns

            Use the repository's DEVELOPMENT.md for guidance on style and conventions.

            FORMAT YOUR REVIEW EXACTLY LIKE THIS:

            🔴 Critical Issues:
            - file.rb:42 - Issue description

            🟡 Minor Issues:
            - file.rb:15 - Issue description

            🔵 Suggestions:
            - file.rb:8 - Suggestion description

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
