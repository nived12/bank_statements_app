version: 2
updates:
  # Keep Ruby gems updated
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group minor/patch updates together to reduce PR noise
    groups:
      dependencies:
        patterns:
          - "*"
    # Only automatically merge safe (patch-level) updates
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    # Ignore major updates unless you decide to handle them manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
