version: 2
updates:
  # Keep Ruby gems updated
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group minor/patch updates together to reduce PR noise
    groups:
      dependencies:
        patterns:
          - "*"
    # Only automatically merge safe (patch-level) updates
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    # Ignore major updates unless you decide to handle them manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ignore all Rails updates - update manually only
      - dependency-name: "rails"
      - dependency-name: "railties"
      - dependency-name: "actioncable"
      - dependency-name: "actionmailbox"
      - dependency-name: "actionmailer"
      - dependency-name: "actionpack"
      - dependency-name: "actiontext"
      - dependency-name: "actionview"
      - dependency-name: "activejob"
      - dependency-name: "activemodel"
      - dependency-name: "activerecord"
      - dependency-name: "activestorage"
      - dependency-name: "activesupport"

  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
