# Bank Statement Parsing Patterns
# This file contains configuration for extracting transaction data from different bank statement formats
# Each bank can have multiple variations of their statement format

banks:
  bbva:
    name: "BBVA Bancomer"
    variations:
      - name: "standard"
        description: "Standard BBVA statement format"
        table_identifiers:
          - "Estado de Cuenta"
          - "Detalle de Movimientos"
          - "Movimientos del Periodo"
        date_patterns:
          - "DD/MMM"  # e.g., 24/MAY
          - "DD-MM-YYYY"
        amount_columns:
          - "CARGOS"
          - "ABONOS"
          - "SALDO"
          - "IMPORTE CARGOS"
          - "IMPORTE ABONOS"
        transaction_codes:
          - "R01"  # Pago Nómina
          - "T16"  # SPEI Enviado
          - "T17"  # SPEI Recibido
          - "W02"  # Retiro
          - "W42"  # Depósito
        transaction_keywords:
          - "PAGO DE NOMINA"
          - "SPEI ENVIADO"
          - "SPEI RECIBIDO"
          - "DEPOSITO DE TERCERO"
          - "INTERESES GANADOS"
          - "RECAUDACION DE IMPUE"
          - "IMSS/INF/AFORE"
          - "TRASPASO ENTRE CUENTAS"
          - "IMPORTE CARGOS"
          - "IMPORTE ABONOS"
          - "CARGOS"
          - "ABONOS"
        non_transaction_patterns:
          - "Estado de Cuenta"
          - "PAGINA \\d+ / \\d+"
          - "Saldo Promedio"
          - "Saldo de Liquidación"
          - "Días del Periodo"
          - "Tasa Bruta Anual"
          - "Depósitos / Abonos"
          - "Retiros / Cargos"
          - "Saldo Final"
        header_extraction:
          account_info:
            - "Cuenta:"
            - "Cliente:"
            - "RFC:"
          statement_period:
            - "Periodo:"
            - "Del:"
            - "Al:"
          balance_info:
            - "Saldo Inicial:"
            - "Saldo Final:"
            - "Saldo Promedio:"
        financial_extraction:
          statement_type: "savings"
          initial_balance:
            - "Saldo Inicial:"
            - "Saldo de Liquidación Inicial:"
          final_balance:
            - "Saldo Final:"
            - "Saldo de Liquidación:"
          period_dates:
            - "Periodo:"
            - "Del:"
            - "Al:"
          summary_totals:
            - "Depósitos / Abonos:"
            - "Retiros / Cargos:"
          interest_info:
            - "Intereses Ganados:"
            - "Tasa Bruta Anual %:"
      
      - name: "credit_card"
        description: "Credit Card statement format with IMPORTE CARGOS/ABONOS"
        table_identifiers:
          - "Movimientos Efectuados"
          - "Estado de Cuenta"
          - "Tarjeta Titular"
          - "IMPORTE CARGOS"
          - "IMPORTE ABONOS"
        date_patterns:
          - "DD/MM/YY"  # e.g., 17/02/24
          - "DD-MM-YYYY"
          - "DD/MM/YYYY"  # e.g., 17/02/2024
        amount_columns:
          - "IMPORTE CARGOS"
          - "IMPORTE ABONOS"
          - "FECHA AUTORIZACION"
          - "FECHA APLICACION"
        transaction_codes:
          - "BMOVIL.PAGO TDC"
          - "ANUALIDAD"
          - "SIX PREMIER"
          - "NETFLIX"
          - "AMAZON"
          - "GOOGLE"
          - "YOUTUBE"
          - "PLAYTOMIC"
          - "MELIMAS"
          - "CONEKTA"
          - "VIVA AEROBUS"
          - "SRIA FINANZAS"
        transaction_keywords:
          - "IMPORTE CARGOS"
          - "IMPORTE ABONOS"
          - "CARGOS"
          - "ABONOS"
          - "ANUALIDAD"
          - "PAGO TDC"
          - "BMOVIL"
          - "TDC"
          - "PREMIUM"
          - "PRIME"
          - "COM"
          - "USD"
          - "TIPO DE CAMBIO"
        non_transaction_patterns:
          - "Estado de Cuenta"
          - "PAGINA \\d+ / \\d+"
          - "Tarjeta Titular"
          - "TOTAL IMPORTES"
          - "Iva :"
          - "Interes:"
          - "Comisiones:"
          - "Capital:"
          - "Capital de promoción:"
          - "Pago excedente:"
          - "BBVA MEXICO"
          - "INSTITUCION DE BANCA MULTIPLE"
          - "GRUPO FINANCIERO BBVA MEXICO"
          - "Av\\. Paseo de la Reforma"
          - "LINEA BBVA:"
          - "CIUDAD DE MEXICO"
          - "LARGA DISTANCIA SIN COSTO"
        header_extraction:
          account_info:
            - "Tarjeta Titular"
            - "No\\. de Tarjeta"
            - "No\\. de Cliente"
            - "RFC:"
          statement_period:
            - "Periodo:"
            - "Del:"
            - "Al:"
        financial_extraction:
          statement_type: "credit"
          summary_totals:
            - "TOTAL IMPORTES"
          interest_info:
            - "Interes:"
          commission_info:
            - "Comisiones:"
          capital_info:
            - "Capital:"
          promotion_info:
            - "Capital de promoción:"
          excess_payment_info:
            - "Pago excedente:"
  
